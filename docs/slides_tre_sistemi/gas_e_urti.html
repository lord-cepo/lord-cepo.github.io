<script>
(function(root){
'use strict';
class StatmechEngine{

 energy(){let e=.5*this.mass*(this.Vx*this.Vx+this.Vy*this.Vy)+.5*this.I*this.omega*this.omega;for(let i=0;i<800;i++)e+=.5*this.v[i]*this.v[i];return e;}
 invariants(){let px=this.mass*this.Vx,py=this.mass*this.Vy,L=this.I*this.omega+this.mass*(this.cx*this.Vy-this.cy*this.Vx);for(let i=0;i<800;i+=2){px+=this.v[i];py+=this.v[i+1];L+=this.p[i]*this.v[i+1]-this.p[i+1]*this.v[i];}return {energy:this.energy(),px,py,L};}
 record(){this.energySamples[this.frame]=Float64Array.from({length:200},(_,i)=>.5*(this.v[2*i]**2+this.v[2*i+1]**2));const k=new Float64Array(4);for(let i=0;i<400;i++){const g=i<200?0:2;k[g]+=.5*this.v[i*2]**2/200;k[g+1]+=.5*this.v[i*2+1]**2/200;}this.history[this.frame]=k;const prev=this.frame?this.sums[this.frame-1]:[0,0,0,0];this.sums[this.frame]=Float64Array.from(k,(x,i)=>x+prev[i]);}

 collide(i,axis,sign){const cs=Math.cos(this.angle),sn=Math.sin(this.angle),nx=sign*(axis===0?cs:-sn),ny=sign*(axis===0?sn:cs),rx=this.p[2*i]-this.cx,ry=this.p[2*i+1]-this.cy;const approach=(this.v[2*i]-this.Vx+this.omega*ry)*nx+(this.v[2*i+1]-this.Vy-this.omega*rx)*ny;if(approach<=0)throw Error('Urto radente non risolto');const lever=rx*ny-ry*nx;const mobility=(this.mode>=1?nx*nx/this.mass:0)+(this.mode>=2?ny*ny/this.mass:0)+(this.mode===3?lever*lever/this.I:0);const impulse=2*approach/(1+mobility);this.v[2*i]-=impulse*nx;this.v[2*i+1]-=impulse*ny;if(this.mode>=1)this.Vx+=impulse*nx/this.mass;if(this.mode>=2)this.Vy+=impulse*ny/this.mass;if(this.mode===3)this.omega+=impulse*lever/this.I;}
 flat(end){let guard=0;while(end-this.t>1e-11){if(++guard>10000)throw Error('Troppi urti simultanei');let dt=end-this.t,hit=-1,axis=0,sign=0;for(let i=0;i<400;i++){const center=i<200?-2.3:2.3;for(let a=0;a<2;a++){const q=this.p[i*2+a]-(a===0?this.cx+center:this.cy),u=this.v[i*2+a]-(a===0?this.Vx:this.Vy);if(!u)continue;const s=u>0?1:-1,time=Math.max(0,(s*2-q)/u);if(time<dt){dt=time;hit=i;axis=a;sign=s;}}}this.drift(dt);if(hit>=0)this.collide(hit,axis,sign);}}

  for(let i=0;i<400;i++){const rx=this.p[2*i]-this.cx+(this.v[2*i]-this.Vx)*dt,ry=this.p[2*i+1]-this.cy+(this.v[2*i+1]-this.Vy)*dt,center=i<200?-2.3:2.3;for(let a=0;a<2;a++){const q=a===0?rx*cs+ry*sn-center:-rx*sn+ry*cs;if(Math.abs(q)<=2)continue;const s=q>0?1:-1;let lo=0,hi=dt;for(let b=0;b<36;b++){const mid=(lo+hi)/2,ang=this.angle+this.omega*mid,c=Math.cos(ang),ss=Math.sin(ang),x=this.p[2*i]-this.cx+(this.v[2*i]-this.Vx)*mid,y=this.p[2*i+1]-this.cy+(this.v[2*i+1]-this.Vy)*mid;const local=a===0?x*c+y*ss-center:-x*ss+y*c;if(s*local>2)hi=mid;else lo=mid;}if(hi<first){first=hi;hit=i;axis=a;sign=s;}}}
  this.drift(first);if(hit>=0)this.collide(hit,axis,sign);
 }}
 advance(){const end=(this.frame+1)*.1;if(this.mode===0){for(let i=0;i<400;i++){const center=i<200?-2.3:2.3;for(let a=0;a<2;a++){const start=this.initial.p[2*i+a]-(a===0?center:0)+2,unfold=start+this.initial.v[2*i+a]*end,phase=((unfold%8)+8)%8;this.p[2*i+a]=(a===0?center:0)+4-Math.abs(phase-4)-2;this.v[2*i+a]=(phase<4?1:-1)*this.initial.v[2*i+a];}}this.t=end;}else if(this.mode===3)this.rotating(end);else this.flat(end);this.frame++;this.record();if(this.frame%100===0)this.states.set(this.frame,this.snapshot());}

if(typeof module!=='undefined'&&module.exports)module.exports=StatmechEngine;
})(typeof globalThis!=='undefined'?globalThis:window);

(function(){
'use strict';
(function(root){
'use strict';
class CollisionDemo{
 static state(t,mode){
  const speedComponent=Math.sqrt((3*3+.3*.3)/2);
  const m=1,M=40,length=4,I=M*length*length/12,radius=.14,p0=[-3,-1.5],v0=[speedComponent,speedComponent];
  const initialAngle=0,nx=1,ny=0;
  const approach=v0[0]*nx+v0[1]*ny,hit=(-radius-p0[0]*nx-p0[1]*ny)/approach;
  const contactX=p0[0]+v0[0]*hit,contactY=p0[1]+v0[1]*hit,lever=contactX*ny-contactY*nx;
  const mobility=(mode?nx*nx/M:0)+(mode>=2?ny*ny/M:0)+(mode===3?lever*lever/I:0);
  const impulse=2*approach/(1+mobility);
  const after=Math.max(0,t-hit),collided=t>=hit,Vx=mode?impulse*nx/M:0,Vy=mode>=2?impulse*ny/M:0,omega=mode===3?impulse*lever/I:0;
  const vx=collided?v0[0]-impulse*nx:v0[0],vy=collided?v0[1]-impulse*ny:v0[1];
  const x=collided?contactX+vx*after:p0[0]+v0[0]*t,y=collided?contactY+vy*after:p0[1]+v0[1]*t;
  return {t,x,y,vx,vy,cx:Vx*after,cy:Vy*after,Vx:collided?Vx:0,Vy:collided?Vy:0,angle:initialAngle+omega*after,omega:collided?omega:0,initialAngle,nx,ny,lever,radius,m,M,I,length,hit,collided};
 }
 static energy(s){return .5*s.m*(s.vx*s.vx+s.vy*s.vy)+.5*s.M*(s.Vx*s.Vx+s.Vy*s.Vy)+.5*s.I*s.omega*s.omega;}
}
root.CollisionDemo=CollisionDemo;
if(typeof module!=='undefined'&&module.exports)module.exports=CollisionDemo;
})(typeof globalThis!=='undefined'?globalThis:window);

function drawCollision(c,w,h,s,mode,colors){
 // Keep one fixed camera per animation, centered on its complete trajectory.
 const cameras=drawCollision.cameras||(drawCollision.cameras=new Map());
 if(!cameras.has(mode)){
  let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
  const include=(x,y)=>{xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y);};
  for(let frame=0;frame<=300;frame++){
   const p=CollisionDemo.state(frame*.01,mode),sn=Math.sin(p.angle),cs=Math.cos(p.angle);
   include(p.x-p.radius,p.y-p.radius);include(p.x+p.radius,p.y+p.radius);
   include(p.cx+2*sn,p.cy-2*cs);include(p.cx-2*sn,p.cy+2*cs);
   if(mode===0){include(.08,-2.38);include(.73,2.38);}
   if(mode===1){include(-1.2,-2.85);include(2.4,-2.3);include(p.cx-.25,-2.75);include(p.cx+.25,-2);}
   if(mode===2){include(-1.2,-2.9);include(3.5,-2.5);include(2.8+p.cx-.42,-2.9);include(2.8+p.cx+.42,2.4);}

 if(mode===0){for(const sy of [-1,1]){line([[.08,sy*1.6],[.08,sy*2.18],[.6,sy*2.18],[.6,sy*1.6]].map(rotate),3);for(const x of [.1,.3,.5])line([[x,sy*2.18],[x+.13,sy*2.38]].map(rotate),1);}}
 if(mode===1){for(const y of [-2.3,-2.7])line([[-1.2,y],[2.3,y]],2);for(let x=-1.1;x<2.3;x+=.3)line([[x,-2.7],[x+.1,-2.85]],.7);line([[s.cx,-2],[s.cx,-2.25]],1.5);line([[s.cx-.25,-2.25],[s.cx+.25,-2.25],[s.cx+.25,-2.75],[s.cx-.25,-2.75],[s.cx-.25,-2.25]],2);}

sizeObserver.observe(root.querySelector('[data-system]').parentElement);
sizeObserver.observe(root.querySelector('.live-chart-column'));
